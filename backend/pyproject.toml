[project]
name = "talent-bridge-backend"
version = "0.2.0"
requires-python = ">=3.12"
# Dependencies live in requirements.txt (pinned).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults, so `= []` is safe on schemas.
"app/schemas/*" = ["RUF012"]
